[pytest]
# ROS humble's PYTHONPATH leaks its pytest11 entry points (launch_testing,
# ament_*) into any interpreter; they need packages the viewer venv does not
# have, so they are switched off here.
addopts = -p no:launch_ros -p no:launch_testing -p no:ament_pep257 -p no:ament_flake8 -p no:ament_xmllint -p no:ament_lint -p no:ament_copyright -p no:cacheprovider
testpaths = tests
