# gen_mechanics rl_games PPO config for POPULATION training under the
# isaaclab_repose task profile. InHandReposeIsaacLabPPO.yaml (NVIDIA's agent)
# plus the I41 population safeguards: network inhand_actor_critic with
# logstd_max 0.0 (std <= 1; see isaacsimenvs/inhand_reorient/policy_network.py)
# and no entropy bonus (entropy_coef 0, no SAPG). Checkpoints are
# interchangeable with InHandReposeIsaacLabPPO.yaml's.
#
# Based on:
# NVIDIA's Isaac-Repose-Cube-Allegro-Direct-v0 agent
# (isaaclab_tasks/direct/allegro_hand/agents/rl_games_ppo_cfg.yaml, Isaac Lab
# 2.3.2), unchanged except for what our vendored rl_games fork needs to run
# it at all (each marked "fork"):
#
#  - fixed_sigma: 'fixed' -- the fork takes a string ('fixed' | 'coef_cond'
#    | 'obs_cond'); NVIDIA's boolean True means a state-independent log-std
#    parameter, which is 'fixed' here.
#  - name starts with "<int>_" -- the fork parses policy_idx from it.
#  - expl_type / use_others_experience: none -- read unguarded by the fork;
#    'none' is plain PPO.
#  - num_actors from env.scene.num_envs -- Isaac Lab's train script sets it
#    from the env; ours interpolates it.
#
# Symmetric actor-critic (no central_value_config), no LSTM, fp32.
# NVIDIA runs 8192 envs: pass env.scene.num_envs=8192 to match exactly.

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: inhand_actor_critic         # I41: actor_critic + projected log-std bound
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: 'fixed'          # fork (NVIDIA: True)
        logstd_max: 0.0               # I41: std <= 1 (actions are clipped to [-1, 1])
    mlp:
      units: [1024, 512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: 0_inhand_repose_isaaclab_pop   # fork: "<int>_" prefix (NVIDIA: allegro_hand)
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....env.scene.num_envs}
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 5000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001

    expl_type: none                 # fork
    use_others_experience: none     # fork

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
