# R2: R1 (InHandHoraTokenTeamPPO.yaml) plus SAPG with 6 exploration blocks, the
# SAPG block of PoseReachJointTransformerSAPG.yaml (the collaborator's working
# recipe for this transformer). Everything else is R1's.
#
# SAPG: leader-follower off-policy update (use_others_experience lf, ratio 1),
# a learned per-block coefficient embedding on the global vector
# (mixed_expl_learn_param) and one log-std row per block (fixed_sigma coef_cond),
# entropy bonus linspace(0.5, 0, 6)[block] x 0.002 (expl_reward_type entropy).
# I41: that entropy bonus inflated the padded MLP's ghost-slot log-std. Here
# ghost columns are held at log-std 0 with no gradient in every row
# (token_policy.py), and logstd_max 0.0 bounds every row (std <= 1).
# Blocks: num_envs = 6 x expl_coef_block_size = 12288 (players.py hardcodes 6).
# Augmented batch 196608 + 196608 / 6 = 229376 = 7 minibatches of 32768.

params:
  seed: 42

  env:
    clip_observations: 10.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: inhand_joint_transformer
    separate: False
    d_model: 128
    n_layers: 4
    n_heads: 1
    ff_mult: 4
    dropout: 0.0
    compile_net: false
    value_head_units: [512, 256]
    arm_head_units: [8]
    design_id_obs: 0              # = env.hora.design_id_obs (one-hot width; per-design statistics)
    per_design_global_norm: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: coef_cond    # SAPG: one log-std row per exploration block
        logstd_max: 0.0
  load_checkpoint: False
  load_path: ''

  config:
    name: 0_inhand_hora_token_team_sapg
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: False   # the network normalises tokens (valid only) and the global vector itself
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....env.scene.num_envs}
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0001
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 1000000
    max_epochs: 1000000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.1
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 2
    critic_coef: 4.0
    clip_value: True
    seq_length: 16
    bounds_loss_coef: 0.0001

    # === SAPG (PoseReachJointTransformerSAPG.yaml) ===
    use_others_experience: lf
    off_policy_ratio: 1.0
    expl_type: mixed_expl_learn_param
    expl_reward_type: entropy
    expl_reward_coef_embd_size: 32
    expl_reward_coef_scale: 0.002
    expl_coef_block_size: 2048   # 12288 envs / 6 blocks (the collaborator: 24576 / 4096)

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
