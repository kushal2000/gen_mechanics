# gen_mechanics rl_games SAPG config for InHandReorient POPULATION training
# (grammar hands via env.assets.hand_population, one shared controller whose
# weights carry across evolution generations). Same network and PPO setup as
# InHandReorientSAPG.yaml (the single-hand config, left unchanged) except for
# the I41 stability fixes, each marked "I41" below:
#
#  - expl_reward_type: none. With `expl_reward_type: entropy`, SAPG gives
#    block b the entropy coefficient linspace(0.5, 0, n_blocks)[b] *
#    expl_reward_coef_scale; with ONE block (expl_coef_block_size ==
#    num_envs) that is 0.5 * 0.002 = 0.001 on every sample, regardless of
#    `entropy_coef: 0.0` below. Adam turns that small, constant push into a
#    steady climb of the log-std wherever the PPO gradient on it is
#    noise-dominated (ghost joint slots; a population the policy has not
#    learned yet). Measured, 64 G_V3S designs, 700 epochs: mean log-std
#    +2.1 with it, +0.2 without it.
#  - network inhand_actor_critic with logstd_max: 0.0 (std <= 1). Actions
#    are clipped to [-1, 1], so a larger std adds no exploration; it only
#    makes actions bang-bang and shrinks the KL per update, which drives the
#    adaptive learning rate to its 1e-2 ceiling (the pilot's MLP/LSTM weights
#    then grew until fp16 activations overflowed: NaN losses, GradScaler
#    scale 0, gen 6 of G_V2S_s0). See isaacsimenvs/inhand_reorient/
#    policy_network.py.
#
# Checkpoints are interchangeable with InHandReorientSAPG.yaml's (same
# parameter names and shapes; the bound is applied to the parameter itself).
#
# Constraint: num_envs % expl_coef_block_size == 0 (task yaml: num_envs=4096).

params:
  seed: 42

  env:
    clip_observations: 10.0   # matches env.obs.clamp_abs_observations
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: inhand_actor_critic   # I41: actor_critic + projected log-std bound
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: coef_cond    # SAPG requires coef_cond (not 'fixed')
        logstd_max: 0.0           # I41: std <= 1 (actions are clipped to [-1, 1])
    mlp:
      units: [256, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 256
      layers: 1
      before_mlp: True
      layer_norm: True

  load_checkpoint: False
  load_path: ''

  config:
    # Must start with `<int>_` — our vendored rl_games parses policy_idx from the prefix.
    name: 0_inhand_reorient_sapg
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    normalize_advantage: True
    reward_shaper:
      scale_value: 0.01
    num_actors: ${....env.scene.num_envs}
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 1000000
    max_epochs: 1000000
    save_best_after: 100
    save_frequency: 3
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.1
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 4.0
    clip_value: True
    horizon_length: 16
    seq_length: 16
    bounds_loss_coef: 0.0001

    # Asymmetric critic slot -- symmetric here (state_list == obs_list), kept
    # only because our vendored rl_games/SAPG expects the block to exist.
    central_value_config:
      minibatch_size: 16384
      mini_epochs: 4
      learning_rate: 3e-4
      kl_threshold: 0.016
      clip_value: True
      normalize_input: True
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [256, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    # === SAPG ===
    use_others_experience: lf
    off_policy_ratio: 1.0
    expl_type: mixed_expl_learn_param
    expl_reward_type: none      # I41: no implicit entropy bonus (was 0.001 with one block)
    expl_reward_coef_embd_size: 32
    expl_reward_coef_scale: 0.002
    expl_coef_block_size: 4096

    player:
      deterministic: False
      games_num: 100000
      print_stats: False
