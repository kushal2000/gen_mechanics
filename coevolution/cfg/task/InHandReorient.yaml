# -----------------------------------------------------------------------------
# Task profile
#   anyrotate: multi-axis in-hand rotation after AnyRotate (Yang et al., CoRL
#     2024, arXiv 2405.07391), section 10 below; anyrotate_profile.py lists the
#     paper references and the adaptations. Overwrites decimation, sim.dt,
#     sim.render_interval, episode_length_s, the default physics material and
#     obs.obs_list/state_list at env construction.
#   legacy (default): this env's original spec -- every section except 9 and 10.
#   isaaclab_repose: NVIDIA's Isaac-Repose-Cube-Allegro-Direct-v0 spec (Isaac
#     Lab 2.3.2), section 9 below; selectable, not adopted (2026-10-01). At env
#     construction it overwrites decimation, sim.dt, sim.render_interval,
#     episode_length_s, the default physics material and obs.obs_list/
#     state_list with its own values, and ignores the action/reward/reset/
#     termination sections. Override its numbers under env.repose.*.
# -----------------------------------------------------------------------------
task_profile: legacy

# -----------------------------------------------------------------------------
# DirectRLEnvCfg top-level required fields (legacy profile values)
# -----------------------------------------------------------------------------
decimation: 2
episode_length_s: 10.0
# action_space / observation_space / state_space are DERIVED in
# InHandReorientEnv's setup_scene from the selected hand's joint count and
# obs.obs_list/state_list -- do not pin them here.

# -----------------------------------------------------------------------------
# 1) sim — 60 Hz policy, 120 Hz physics (same as PoseReach)
# -----------------------------------------------------------------------------
sim:
  dt: 0.00833333333   # 1/120
  render_interval: 2
  gravity: [0.0, 0.0, -9.81]
  physx:
    solver_type: 1
    min_position_iteration_count: 8
    max_position_iteration_count: 8
    min_velocity_iteration_count: 0
    max_velocity_iteration_count: 0
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025
    gpu_max_rigid_contact_count: 8388608
    gpu_max_rigid_patch_count: 4194304

# -----------------------------------------------------------------------------
# 2) scene — one fixed hand, no per-env distinct assets, so the ordinary
#    replicator can clone it (unlike pose_reaching_6d's population path).
# -----------------------------------------------------------------------------
scene:
  num_envs: 4096              # must divide by expl_coef_block_size (4096) below
  env_spacing: 0.6
  replicate_physics: true
  clone_in_fabric: true

# -----------------------------------------------------------------------------
# 3) assets — which hand, and the cube it reorients
# -----------------------------------------------------------------------------
assets:
  # A hand_sampler/grammar_bench/manifest.json id: "sharpa", "allegro_right",
  # "dclaw", "wuji_right", "xhand_right", "tesollo_dg5f_right", "orca_right",
  # "leap_right", "barrett_bh". Override on the CLI with env.assets.hand_id=<id>.
  hand_id: "sharpa"
  object_size_m: 0.06
  object_density: 500.0

  modify_asset_frictions: true
  robot_friction: 0.5
  finger_tip_friction: 1.0
  object_friction: 0.7
  object_restitution: 0.0

# -----------------------------------------------------------------------------
# 4) obs — symmetric actor-critic (Phase 1 has no privileged state yet)
# -----------------------------------------------------------------------------
obs:
  obs_list: [joint_pos, joint_vel, prev_actions,
             object_pos_palm, object_quat_palm, object_lin_vel_palm, object_ang_vel_palm,
             goal_quat_palm, object_quat_rel_goal, fingertip_pos_palm]
  state_list: [joint_pos, joint_vel, prev_actions,
               object_pos_palm, object_quat_palm, object_lin_vel_palm, object_ang_vel_palm,
               goal_quat_palm, object_quat_rel_goal, fingertip_pos_palm]
  clamp_abs_observations: 10.0

# -----------------------------------------------------------------------------
# 5) action — joint-position targets, moving-average smoothing
# -----------------------------------------------------------------------------
action:
  hand_moving_average: 0.2
  dof_speed_scale: 1.0

# -----------------------------------------------------------------------------
# 6) reward — IsaacGymEnvs AllegroHand/ShadowHand recipe: dense inverse-
#    distance rotation term + position term + goal bonus - action/drop
#    penalties (rotation_progress_scale kept for A/B, off by default)
# -----------------------------------------------------------------------------
reward:
  rot_reward_scale: 1.0
  rot_eps: 0.1
  dist_reward_scale: 10.0
  rotation_progress_scale: 0.0
  goal_bonus: 250.0
  action_penalty_scale: 0.0002
  action_delta_penalty_scale: 0.0003
  hand_velocity_penalty_scale: 0.0003
  drop_penalty: 50.0

# -----------------------------------------------------------------------------
# 7) reset — object spawn above the palm, goal sampling + curriculum
# -----------------------------------------------------------------------------
reset:
  object_spawn_offset: [0.0, 0.0, 0.06]
  object_position_noise: 0.01
  joint_reset_noise: 0.1
  goal_sampling_type: absolute       # "absolute" | "delta" | "axis"; used only if curriculum is off
  delta_rotation_degrees: 90.0
  drop_distance_m: 0.24
  goal_curriculum_enabled: true
  # I26: axis-only by default (full random orientation was not learnable in
  # a 60-min SHARPA run). "full" stays available by config, e.g.
  # env.reset.goal_curriculum_stages='[axis,full]' on the CLI; with >1 stage
  # the goal curriculum only advances once the tolerance curriculum below is
  # at its floor (goal_curriculum.py's decoupling rule -- never the same step).
  goal_curriculum_stages: [axis]
  goal_curriculum_interval: 3000
  goal_curriculum_success_threshold: 3.0

# -----------------------------------------------------------------------------
# 8) termination — end-of-episode conditions + the tolerance curriculum
#    (fields match pose_reaching_6d.env_cfg.TerminationCfg 1:1 -- reused as a
#    class so coevolution/utils/rlgames_utils.py's curriculum checkpoint
#    restore, which reads these names directly, keeps working on resume)
# -----------------------------------------------------------------------------
termination:
  episode_length: 600                 # policy steps (600 * 2 * 1/120 = 10s)
  success_tolerance: 0.4              # curriculum start, radians
  target_success_tolerance: 0.1       # curriculum floor, radians
  eval_success_tolerance: null
  success_steps: 10
  max_consecutive_successes: 50
  force_consecutive_near_goal_steps: false
  tolerance_curriculum_increment: 0.9
  tolerance_curriculum_interval: 3000
  tolerance_curriculum_success_threshold: 3.0

# -----------------------------------------------------------------------------
# 9) repose -- the isaaclab_repose profile: Isaac Lab 2.3.2
#    isaaclab_tasks/direct/allegro_hand/allegro_hand_env_cfg.py
#    (AllegroHandEnvCfg), isaaclab_assets/robots/allegro.py (ALLEGRO_HAND_CFG)
#    and the DexCube USD. tests/test_repose_profile.py checks these against
#    NVIDIA's installed config.
# -----------------------------------------------------------------------------
repose:
  decimation: 4                     # 1/120 s physics, 30 Hz policy
  episode_length_s: 10.0
  sim_dt: 0.008333333333333333      # 1/120 to full precision (300 steps per 10 s episode)
  static_friction: 1.0              # sim.physics_material (hand and cube)
  dynamic_friction: 1.0
  restitution: 0.0
  bounce_threshold_velocity: 0.2
  object_size_m: 0.072              # DexCube: 0.06 m collision cube, scale 1.2
  object_density: 400.0
  object_mass_kg: 0.216             # NVIDIA's effective cube mass: the DexCube USD authors physics:mass 0.216,
                                    # which takes precedence over density 400 (measured in their running env)
  object_contact_offset: 0.001      # DexCube collider
  object_rest_offset: 0.0
  object_torsional_patch_radius: 0.1
  object_min_torsional_patch_radius: 0.008
  object_solver_position_iterations: 8
  object_solver_velocity_iterations: 0
  object_sleep_threshold: 0.005
  object_stabilization_threshold: 0.0025
  object_max_depenetration_velocity: 1000.0
  object_enable_gyroscopic_forces: true
  hand_disable_gravity: true        # ALLEGRO_HAND_CFG rigid/articulation props
  hand_angular_damping: 0.01
  hand_max_depenetration_velocity: 1000.0
  hand_solver_position_iterations: 8
  hand_solver_velocity_iterations: 0
  hand_sleep_threshold: 0.005
  hand_stabilization_threshold: 0.0005
  hand_stiffness: 3.0               # actuator of every joint of a single hand: NVIDIA's Allegro
  hand_damping: 0.1                 #   (ALLEGRO_HAND_CFG + its USD). < 0 keeps the hand's own value.
  hand_armature: 0.0                #   Not applied on the grammar-population path.
  hand_joint_friction: 0.01
  hand_effort_limit: 0.5
  hand_velocity_limit: 6.283
  collision_from_visuals: false     # true: convex hulls of the visual meshes as colliders
  hand_asset: ""                    # "isaaclab_allegro": NVIDIA's Allegro USD (diagnostic)
  hand_pose_file: repose_hand_poses.json   # per-hand pose overrides (isaacsimenvs/inhand_reorient/); "" = palm-up calibration
  reset_position_noise: 0.01
  reset_dof_pos_noise: 0.2
  reset_dof_vel_noise: 0.0
  in_hand_pos_offset: [0.0, 0.0, -0.04]   # position target = spawn point + this (world axes)
  dist_reward_scale: -10.0
  rot_reward_scale: 1.0
  rot_eps: 0.1
  action_penalty_scale: -0.0002
  reach_goal_bonus: 250.0
  fall_penalty: 0.0
  fall_dist: 0.24
  success_tolerance: 0.2            # fixed; no tolerance curriculum
  max_consecutive_success: 0
  av_factor: 0.1
  vel_obs_scale: 0.2
  act_moving_average: 1.0

# -----------------------------------------------------------------------------
# 10) anyrotate -- the anyrotate profile (AnyRotate, CoRL 2024). [..] = paper
#     reference; "adapt." = a documented departure (anyrotate_profile.py,
#     evolution/README.md).
# -----------------------------------------------------------------------------
anyrotate:
  sim_dt: 0.016666666666666666      # [Sec. 4] 1/60 s
  decimation: 3                     # [Sec. 4] 20 Hz control
  episode_length_s: 30.0            # [Sec. 4] 600 steps
  static_friction: 10.0             # [Table 4] object and hand friction
  dynamic_friction: 10.0
  restitution: 0.0
  axis_sampling: sphere             # sphere | principal | z (paper: "arbitrary" axes)
  axis_curriculum_z_first: false    # adapt.: z axis first, then axis_sampling
  axis_curriculum_rotations: 0.5
  z_axis_frame: palm                 # palm (palm body +z) | world_up (palm normal of the palm-up hand; the paper's z)
  goal_increment_deg: 30.0          # [Table 9]
  goal_advance: reach               # reach (paper) | timer (A/B: a pending goal advances every goal_timer_s)
  goal_timer_s: 1.5
  goal_tol_metric: rotation_rad     # adapt.: d_tol read as radians (see goal_reached)
  d_tol: 0.15                       # [Table 5, teacher]
  keypoint_distance_m: 0.05         # [App. B.1] 6 keypoints, 5 cm
  kp_a: 50.0                        # [Eq. 3]
  kp_b: 2.0
  kp_scale: 1.0                     # the undefined numerator d_kp of Eq. 3
  rot_clip: 0.025                   # [Eq. 4] c1, rad
  w_kp: 1.0                         # [App. B.1] reward weights
  w_rot: 5.0
  w_goal: 10.0
  w_gc: 0.1
  w_bc: 0.2
  w_omega: 0.5
  w_pose: 0.5
  w_work: 0.1
  w_torque: 0.05
  w_penalty: 50.0
  omega_max: 0.6                    # [Eq. 8]
  reward_curriculum: true           # [App. B.3] lambda_rew over [g_min, g_max]
  curriculum_g_min: 1.0
  curriculum_g_max: 2.0
  curriculum_ema: 0.01
  d_max: 0.1                        # [Eq. 12] drop: kp_dist > 0.1
  axis_dev_max_deg: 45.0            # [Eq. 12]
  axis_check_grace_steps: 10        # adapt.: settle phase; then the axis reference and first goal are re-made
  action_scale: 0.026               # [Sec. 3.1] Delta theta in [-0.026, 0.026] rad
  action_eta: 0.5                   # adapt.: eta not given
  contact_threshold: 0.25           # [App. F, Eq. 16] N
  force_alpha: 0.5                  # [Eq. 17]
  force_beta: 0.6                   # [Eq. 18]
  force_max: 5.0
  pose_beta: 0.6                    # [Eq. 19]
  pose_max: 0.53
  contact_data_per_prim: 32         # contact-point buffer per body (4 overflowed for SHARPA meshes)
  object_shape: box                 # adapt.: one shape per run (box | capsule); a capsule rolls off the open palm
  capsule_radius: 0.0295            # [Table 4] midpoints of the ranges
  capsule_width: 0.006
  box_size: 0.0525
  mass_range: [0.025, 0.2]          # [Table 4]
  com_range: 0.01
  object_contact_offset: 0.002
  object_rest_offset: 0.0
  obs_noise: true                   # [Table 4] observation noise
  joint_noise: 0.03
  tip_pos_noise: 0.005
  tip_quat_noise: 0.01
  contact_pose_noise: 0.0174
  contact_force_noise: 0.1
  reset_joint_noise: 0.1            # drop reset (no grasp_cache, or a design without a stable grasp)
  hand_orientation_randomization: false   # team decision: stationary palm-up hand
  grasp_cache: ""                   # [App. C; HORA] .npz of stable grasps (grasp_cache.py); "" = drop reset
  grasp_cache_generate: false       # generate missing designs' grasps at env start and save them
  grasp_cache_prune: false          # keep only this env's designs in the saved cache (evolution driver)
  grasp_per_design: 1000            # AnyRotate 10000 per object, HORA 50000 per scale
  grasp_gen_max_rounds: 60
  grasp_gen_max_minutes: 15.0
  grasp_gen_rounds_without_grasp: 15 # no stable grasp after this many rounds: non-viable
  grasp_gen_seed: 0
  grasp_hold_s: 3.0                 # HORA 3.3 s (50 steps, 15 Hz); AnyRotate 6 s
  grasp_presettle_steps: 5          # adapt.: hand settles before the object is placed
  grasp_joint_sample_noise: 0.3     # [App. C] U(-0.3, 0.3) rad; HORA 0.25
  grasp_curl_frac: 0.75             # adapt.: share of candidates at a random curl of every joint
  grasp_tip_place_frac: 0.9         # adapt.: share placed at the fingertip centroid (rest: spawn point)
  grasp_obj_pos_noise: 0.01
  grasp_max_disp_m: 0.02            # HORA: falls at most 1.5 cm
  grasp_max_lin_speed: 0.05
  grasp_max_ang_speed: 0.5
  grasp_min_tip_contacts: 2         # HORA >= 2; AnyRotate > 2
  grasp_max_nontip_contacts: -1     # -1 off (HORA); AnyRotate 0
  grasp_max_tip_dist_m: 0.1         # HORA: every fingertip within 0.1 m
  grasp_max_mean_tip_dist_m: -1.0   # -1 off; AnyRotate: total 0.2 over 4 tips
  grasp_gravity_cycle: false        # AnyRotate: gravity along +-x, +-y, +-z during the hold
  grasp_max_joint_speed: -1.0       # peak real-joint speed over the hold (rad/s); -1 off (recorded either way)
  grasp_reset_joint_noise: 0.0      # HORA and AnyRotate add none at reset
  grasp_reset_obj_pos_noise: 0.0
  grasp_settle_steps: 0             # settle phase for grasp-initialised envs (none, as the paper)
  hand_pose_file: repose_hand_poses.json
  collision_from_visuals: false
  hand_disable_gravity: false       # [Sec. 4] gravity on hand and object
  hand_angular_damping: 0.01
  hand_max_depenetration_velocity: 1000.0
  hand_solver_position_iterations: 8
  hand_solver_velocity_iterations: 0
  hand_sleep_threshold: 0.005
  hand_stabilization_threshold: 0.0005
  hand_stiffness: 3.0               # adapt.: the paper system-identifies its Allegro (App. D)
  hand_damping: 0.1
  hand_armature: 0.0
  hand_joint_friction: 0.01
  hand_effort_limit: 0.5
  hand_velocity_limit: 6.283
  population_hand_actuator: false   # population: every real joint gets the actuator above (default: designs' own)
  population_palm_collider: capsule # capsule | mount_hull | mount_hull_filtered (convex palm over the root capsule and finger mounts)
  population_capsule_radius: -1.0   # > 0: link and root collider radius (m); -1: the design's own
  population_projected_pose: false  # projected hands stand where their URDF asset does (hand_pose_file)
  grasp_canonical_profile: palm_up   # population grasp search: palm_up | opposition | hora_like
  grasp_projected_canonical: false  # grasp search: projected hands start from their URDF canonical grasp pose
  gravity_curriculum: false         # Isaac Lab Dexsuite ADR gravity curriculum (optional)
  gravity_max_difficulty: 10
  gravity_promote_goals: 1
  gravity_promote_metric: goals     # goals (Dexsuite success) | rotations (per episode; for the hora profile)
  gravity_promote_rotations: 0.25
  gravity_promotion_only: false

# -----------------------------------------------------------------------------
# 11) hora -- the hora profile (HORA, Qi et al., CoRL 2022; hora_profile.py):
#     HORA's reward, termination, observation and control on the anyrotate
#     scene, object, hand and grasp cache (section 10).
# -----------------------------------------------------------------------------
hora:
  sim_dt: 0.008333333333333333      # sim.dt
  decimation: 6                     # controlFrequencyInv: 20 Hz
  episode_length_s: 20.0            # episodeLength 400
  action_scale: 0.041666666666666664  # targets = prev + 1/24 * a
  friction: 1.0                     # adapt.: HORA U(0.3, 3.0) per env
  angvel_clip_min: -0.5
  angvel_clip_max: 0.5
  rotate_reward_scale: 1.0
  obj_linvel_penalty_scale: -0.3
  pose_diff_penalty_scale: -0.3
  torque_penalty_scale: -0.1
  work_penalty_scale: -2.0
  joint_noise_scale: 0.02
  drop_dz: 0.015                    # adapt.: HORA's absolute reset_height_threshold, relative here
  z_axis_frame: world_up
  morph_obs: false                  # population: morphology context in actor and critic observations
  ghost_action_mask: false          # population: per-slot sign (+1 real / -1 ghost) last, for ghost_mask_tail
  per_design_reward_norm: false     # population: reward / running per-design reward RMS
  reward_norm_decay: 0.999
  reward_norm_floor: 0.05
  disjoint_slots: false            # population: each design's real joints in their own policy columns
  design_id_obs: 0                  # population: one-hot design index this wide (per_design_nets), 0 = off
