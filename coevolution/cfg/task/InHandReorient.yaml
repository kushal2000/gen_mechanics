# =============================================================================
# IN-HAND REORIENTATION -- a fixed palm-up hand, no arm, one cube.
#
# Copied from PoseReach.yaml, which is the base task, with ONLY task-level
# fields changed. decimation, the whole sim/PhysX block and every
# domain_randomization range are deliberately identical: they are tuned for
# this hardware and task family, and moving them alongside the task would make
# any comparison against the pose-reaching runs unreadable.
#
# The YAML is applied ON TOP of InHandReorientEnvCfg (hydra_utils does
# env_cfg.from_dict(overlay) after the dataclass is built), so anything set
# here wins over that class's __post_init__. The two are kept in agreement on
# purpose -- the class makes the task correct when constructed directly, e.g.
# by an eval script; this file is what a run actually loads.
# =============================================================================
# -----------------------------------------------------------------------------
# DirectRLEnvCfg top-level required fields
# -----------------------------------------------------------------------------
decimation: 2
episode_length_s: 10.0
# action_space / observation_space / state_space are all DERIVED in
# PoseReachEnv.__init__ -- action_space from the selected RobotSpec's joint
# count, obs/state from obs.obs_list / obs.state_list. Do not pin them here: a
# stale literal would either fail the spec cross-check or silently describe the
# wrong robot.

# -----------------------------------------------------------------------------
# 1) sim — SimulationCfg (60 Hz policy control, 120 Hz physics)
# -----------------------------------------------------------------------------
sim:
  dt: 0.00833333333   # 1/120
  render_interval: 2
  gravity: [0.0, 0.0, -9.81]
  physx:
    solver_type: 1                     # 1 = TGS (matches legacy)
    min_position_iteration_count: 8
    max_position_iteration_count: 8
    min_velocity_iteration_count: 0
    max_velocity_iteration_count: 0
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025

# -----------------------------------------------------------------------------
# 2) scene — plain InteractiveSceneCfg (Isaac Lab rejects unknown scene fields,
#    so asset metadata lives under `assets:` below).
# -----------------------------------------------------------------------------
scene:
  num_envs: 24576
  env_spacing: 0.6   # no arm reach to clear (was 1.2)
  # Both must be false for MultiUsdFileCfg to spawn per-env distinct
  # handle_head USDs: replicate_physics=false makes PhysX parse each env
  # as its own subtree; clone_in_fabric=false makes the cloner land env
  # prims in the USD stage (not just Fabric), so the multi-asset
  # spawner's find_matching_prim_paths sees env_1..env_{N-1}.
  replicate_physics: false
  clone_in_fabric: false

# -----------------------------------------------------------------------------
# 3) assets — URDFs, procedural-generation knobs, static per-material frictions
# -----------------------------------------------------------------------------
assets:
  # NOTE: the hand-only mount is NOT a field here. It rides on the robot
  # reference as a "handonly:" prefix --
  #     ROBOT_SPEC=handonly:/path/to/population.json
  # because the agent YAML interpolates the network's spec from
  # env.assets.robot_spec, and a second knob would let the policy build itself
  # for 37 joints while the articulation has 30. One string, one answer.
  # The robot knob. Everything hardware-specific (joint names and order, PD
  # gains, home pose, palm/fingertip geometry, self-collision adjacency, action
  # dim) comes from this spec -- see isaacsimenvs/pose_reaching_6d/scene_utils/robots/. Override on the CLI with
  # env.assets.robot_spec=<name>.
  robot_spec: "sharpa_iiwa14"
  # Empty => use the spec's own URDF path.
  robot_urdf: ""
  table_urdf: "assets/urdf/table_narrow.urdf"

  handle_head_types: ["cube"]
  object_pool: cube1            # one 45 mm, 46 g cube
  object_assignment: env_modulo # one object, so cycling designs over it is moot
  num_assets_per_type: 100

  modify_asset_frictions: true
  robot_friction: 0.5
  finger_tip_friction: 1.5
  object_friction: 1.0   # a cube resting on a flat palm needs grip (was 0.5)
  table_friction: 0.5

# -----------------------------------------------------------------------------
# 3) obs — asymmetric actor-critic obs layout
# -----------------------------------------------------------------------------
obs:
  # Geometry is measured from the end effector (link_7's origin) in metres:
  # the one point every design shares. The palm enters as its four keypoints.
  # Runs before 2026-09-17 used palm_center / hand_scale; their saved configs
  # carry no geometry_origin and evaluate as they trained.
  geometry_origin: ee
  # Compare object and goal keypoints about their OWN centres, so
  # _keypoints_max_dist is a pure rotation residual. Still metres, so the
  # tolerance curriculum and every downstream reader are unaffected.
  orientation_only_goal: true
  state_list: [joint_pos, joint_vel, prev_joint_pos, prev_joint_vel, prev_action_targets,
               joint_link_bbox, joint_lower, joint_upper, joint_enabled,
               object_keypoints_rel_joint, palm_keypoints, ee_pos, ee_rot, ee_vel,
               object_rot, object_vel, keypoints_rel_ee,
               keypoints_rel_goal, object_scales, closest_keypoint_max_dist,
               closest_fingertip_dist, lifted_object, progress, successes, reward]
  obs_list: [joint_pos, joint_vel, prev_joint_pos, prev_joint_vel, prev_action_targets,
             joint_link_bbox, joint_lower, joint_upper, joint_enabled,
             object_keypoints_rel_joint, palm_keypoints, ee_pos, ee_rot,
             object_rot, keypoints_rel_ee,
             keypoints_rel_goal, object_scales]
  clamp_abs_observations: 10.0

# -----------------------------------------------------------------------------
# 4) action — moving-average smoothing + speed/force scales
# -----------------------------------------------------------------------------
action:
  arm_moving_average: 0.1
  hand_moving_average: 0.1
  dof_speed_scale: 1.5

# -----------------------------------------------------------------------------
# 5) reward — keypoint + lifting + distance-delta + reach-goal + action penalties
# -----------------------------------------------------------------------------
reward:
  # The centred metric spans only 0..117 mm (keypoint radius 58.5 mm for a
  # 45 mm cube at keypoint_scale 1.5), where the transport task's spanned
  # metres. At 200 the whole shaping budget per goal would be ~23 against a
  # 1000 goal bonus. 2000 restores roughly the pose task's ~1:4 ratio.
  # READ episode_cumulative/keypoint_rew against bonus_rew in the first run
  # and rebalance -- this is a calculated starting point, not a tuned one.
  keypoint_rew_scale: 2000.0
  keypoint_scale: 1.5
  object_base_size: 0.045  # == the cube edge, so object_scale is exactly (1,1,1)
  fixed_size: [0.045, 0.045, 0.045]   # the cube; reward and obs keypoints coincide
  fixed_size_keypoint_reward: true

  lifting_rew_scale: 0.0      # no lift phase: the object starts in the hand
  lifting_bonus: 0.0          # ditto
  lifting_bonus_threshold: 0.15

  distance_delta_rew_scale: 0.0   # no fingertip approach to shape
  reach_goal_bonus: 1000.0

  kuka_actions_penalty_scale: 0.03
  # 0.0003, not the transport task's 0.003. MEASURED: at 0.003 the velocity
  # penalty came to about -28 per episode against +8 of keypoint progress, so
  # holding still beat manipulating -- every episode ended by timeout, nothing
  # was ever dropped (done_fall 0.0003) and 63 goals landed in 544k episodes.
  # That value was set when the keypoint reward spanned METRES; the centred
  # rotation residual spans 0..117 mm. IsaacLab's inhand task uses 2.5e-5 for
  # the same term, so even 0.0003 stays an order of magnitude above it.
  #
  # Note kuka_actions_penalty_scale contributes exactly 0 here -- there are no
  # arm joints -- so this is the only regularizer, unopposed.
  hand_actions_penalty_scale: 0.0003

# -----------------------------------------------------------------------------
# 6) reset — initial-state distribution + goal sampling
# -----------------------------------------------------------------------------
reset:
  # Start holding the object, placed at the palm rather than above the table.
  # Also latches _lifted_object, without which keypoint_reward -- gated on it --
  # would be identically zero for the whole run.
  object_in_hand: true
  # On the FINGERTIPS, not the palm: they are the grippy surface
  # (mu 1.25 with the cube against the palm's 0.75), so the fingers
  # hold the object rather than the slab.
  in_hand_placement: fingertips
  # Halfway out from the palm centre to the fingertip centroid, not all the way.
  # At 1.0 the cube sat right at the tips, which is the very edge of where the
  # fingers can act on it -- they can only push it further out from there. 0.5
  # keeps it inside the finger span so flexing has somewhere to carry it, and the
  # palm-slab clearance is interpolated with it, so this is one position rather
  # than a blend of two.
  in_hand_fingertip_fraction: 0.5
  # DROPPED onto the fingers, not started in contact with them. The lift already
  # clears the highest fingertip pad and the object's exact reach along the palm
  # normal for its sampled orientation, so this is pure margin on top -- it buys
  # robustness against the pad point not being the tip's outermost surface (a
  # capsule has a radius the pad point does not carry).
  in_hand_drop_margin: 0.01
  in_hand_position_noise: 0.005
  reset_position_noise_x: 0.1
  reset_position_noise_y: 0.1
  reset_position_noise_z: 0.02
  fixed_start_pose: null

  reset_dof_pos_random_interval_arm: 0.1
  reset_dof_pos_random_interval_fingers: 0.1
  reset_dof_vel_random_interval: 0.5

  # The palm sits at z=0.50 and the table surface is table_reset_z + 0.15,
  # so the default 0.38 would put it at 0.53 -- straight through the hand.
  # Drop it out of the scene; the ground plane at z=0 is the catch floor.
  table_reset_z: -1.0
  table_reset_z_range: 0.01
  table_object_z_offset: 0.25

  # "absolute" samples orientation with random_orientation, i.e. uniform
  # SO(3). "delta" would cap each new goal at 90 deg from the last, which
  # is not the task. A full reset already forces absolute; this is what the
  # mid-episode resample after a goal HIT uses.
  goal_sampling_type: absolute        # "delta" | "absolute"
  delta_goal_distance: 0.1
  delta_rotation_degrees: 90.0
  # Pinned: the goal POSITION is not scored under orientation_only_goal, so
  # this only places the GoalViz marker. 15 cm above the palm.
  target_volume_mins: [0.0, 0.0, 0.65]
  target_volume_maxs: [0.0, 0.0, 0.65]
  target_volume_region_scale: 1.0

# -----------------------------------------------------------------------------
# 7) termination — end-of-episode conditions + tolerance curriculum
# -----------------------------------------------------------------------------
termination:
  # A fixed palm-up hand has no floor to fall below, so "dropped" is a distance
  # from the palm body. Borrowed from IsaacLab's inhand task.
  drop_distance_m: 0.3
  episode_length: 600                 # policy steps (600 * 2 * 1/120 = 10s)
  # NO CURRICULUM. Both bounds are the same value, so the clamp in
  # update_tolerance_curriculum (new_tol = clamp(tol*0.9, target, success)) can
  # never move it -- the curriculum is inert by construction rather than
  # switched off somewhere else. IsaacLab's inhand task likewise trains against
  # one fixed threshold.
  #
  # The tolerance is compared against max keypoint distance, so it maps to an
  # angle: threshold = tol * keypoint_scale, angle = 2*asin(thr/2r), r = 58.5 mm
  # for a 45 mm cube at keypoint_scale 1.5.
  #   0.01547 -> 22.9 deg (OpenAI's 0.4 rad)
  #   0.00997 -> 14.7 deg
  #   0.00390 ->  5.7 deg (IsaacLab / DexPBT's 0.1 rad)  <- this
  #
  # Tight enough that goals/episode may read 0 for a long time. That is fine
  # and deliberate: the keypoint reward is PROGRESS-based and stays dense all
  # the way down, so designs are still ranked by how far they rotate the cube,
  # and the success rate is then an honest measure rather than something a
  # curriculum manufactured by loosening the target.
  success_tolerance: 0.0039           # fixed; 0.1 rad on a 45 mm cube
  target_success_tolerance: 0.0039    # == success_tolerance: curriculum inert
  eval_success_tolerance: null
  # 1, not the transport task's 10. A goal scores the instant the residual
  # crosses the threshold rather than needing it held for ten consecutive
  # steps. Measured: the policy reaches the threshold only in brief excursions
  # (per-step trace, min residual 15.9 mm against a 5.85 mm threshold, with one
  # earlier touch at 5.30 mm that scored nothing), so requiring a ten-step hold
  # asks for a stability it has no grasp to provide.
  #
  # Two consequences worth knowing: reach_goal_bonus is amortised as
  # bonus/success_steps per near-goal step, so at 1 it pays the full 1000 in
  # one step instead of 100 over ten; and goals resample on every crossing,
  # which resets _closest_keypoint_max_dist and so keeps the progress reward
  # live instead of exhausting it after a near miss.
  success_steps: 1
  max_consecutive_successes: 50
  force_consecutive_near_goal_steps: false
  tolerance_curriculum_increment: 0.9
  tolerance_curriculum_interval: 3000

# -----------------------------------------------------------------------------
# 8) domain_randomization — sim2real essentials (delays, noise, impulses)
# -----------------------------------------------------------------------------
domain_randomization:
  # obs / action latency
  use_obs_delay: true
  obs_delay_max: 3
  use_action_delay: true
  action_delay_max: 3

  # object state delay + noise
  use_object_state_delay_noise: true
  object_state_delay_max: 10
  object_state_xyz_noise_std: 0.01
  object_state_rotation_noise_degrees: 5.0
  object_scale_noise_multiplier_range: [1.0, 1.0]

  # per-step obs noise
  joint_velocity_obs_noise_std: 0.1

  # random force/torque impulses
  # OFF for in-hand. force_only_when_lifted is ALWAYS satisfied now that the
  # object starts latched as lifted, so these impulses would fire every step
  # of every episode and make a cube on a flat palm unholdable. Zero also
  # skips the per-substep PhysX wrench upload entirely.
  force_scale: 0.0
  force_prob_range: [0.001, 0.1]
  force_decay: 0.0
  force_decay_interval: 0.08
  force_only_when_lifted: true

  torque_scale: 0.0
  torque_prob_range: [0.001, 0.1]
  torque_decay: 0.0
  torque_decay_interval: 0.08
  torque_only_when_lifted: true
